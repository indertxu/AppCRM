<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#062319" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>Next Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Development only (npm run dev). React 19's development build records every re-render for the
      // browser's Performance panel and, to do so, compares every changed prop deeply — with lists of
      // 25,000 contacts or 15,000 companies passed around, that alone made each keystroke in a panel
      // take hundreds of milliseconds. Without console.timeStamp React skips that bookkeeping.
      // The production build doesn't have it, so this line does nothing there.
      if ("%MODE%" === "development") { try { console.timeStamp = undefined; } catch (e) {} }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
